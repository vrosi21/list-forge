x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/vrosi21/list-forge-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - api-data:/data
    expose:
      - "8000"
    networks:
      proxy:
        aliases:
          - listforge-api
    logging: *logging

networks:
  proxy:
    name: n8n_default
    external: true

volumes:
  api-data:
