x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/vrosi21/list-forge-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - api-data:/data
    expose:
      - "8000"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  api-data:
  caddy-data:
  caddy-config:
